[project]
name = "pool-agent"
version = "0.1.0"
description = "Pool — autonomous neighborhood group-buying coordinator (agent + domain + API)"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.52.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "mangum>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Documented exceptions, not blanket suppressions:
#   E501  line length is handled by the formatter's 110-column target
#   B008  FastAPI's dependency injection *requires* calls in argument defaults
#         (`Query(...)`, `Body(...)`); this is the framework's documented idiom
#   UP042 domain enums are `(str, Enum)` on purpose, not `StrEnum`: the mixin form
#         serialises identically through json, DynamoDB, and pydantic on every
#         supported runtime, and these types cross all three boundaries
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
