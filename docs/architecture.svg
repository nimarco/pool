<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Pool — deployed judge architecture and implementation boundary</title>
  <desc id="desc">People reach a React app served by one Lambda Function URL, which signs an invocation of Amazon Bedrock AgentCore Runtime. Inside the runtime, a bounded Strands agent loop calls Amazon Bedrock for inference and reaches the world only through twelve typed Pool tools. Those tools call deterministic orchestration services over a pure domain layer that performs no I/O, backed by a single DynamoDB table and CloudWatch run records. The browser reads the exact run and resulting pool back from that table. Payments, the supplier purchase and routing are simulated adapters. EventBridge exists only in an un-deployed pilot stack; the deployed judge account has zero EventBridge rules.</desc>

  <!-- Hand-authored rather than auto-laid-out. A generated flowchart of this graph came
       out 1474 x 2902, which is illegible in a README and useless in a video frame; a
       diagram nobody can read is not evidence of anything. Colours are explicit so it
       stays readable on a light or a dark page. -->

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8a8272"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#f7f4ef"/>

  <!-- ─────────────────────────────────────────────────────── title -->
  <text x="40" y="52" font-size="25" font-weight="600" fill="#17150f" letter-spacing="-0.3">Pool — deployed judge architecture + implementation boundary</text>
  <text x="40" y="76" font-size="13.5" fill="#575145">Solid AWS path is deployed. Dashed components are implemented but absent from the judge stack. The model decides; deterministic code verifies and writes.</text>

  <!-- ─────────────────────────────────────────────────────── people -->
  <rect x="40" y="104" width="236" height="146" rx="10" fill="#ffffff" stroke="#ded7c9"/>
  <text x="58" y="128" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#a0512a">PEOPLE</text>
  <g font-size="13.5" fill="#17150f">
    <text x="58" y="154">Buyer<tspan fill="#575145" font-size="12"> · declares a recurring need</tspan></text>
    <text x="58" y="182">Host<tspan fill="#575145" font-size="12"> · earns recorded compensation</tspan></text>
    <text x="58" y="210">Operator<tspan fill="#575145" font-size="12"> · offers, payments, cases</tspan></text>
  </g>
  <text x="58" y="230" font-size="11.5" fill="#a0512a">Asked only when a rule they</text>
  <text x="58" y="245" font-size="11.5" fill="#a0512a">set did not pass</text>

  <!-- ─────────────────────────────────────────────────────── edge -->
  <rect x="300" y="104" width="292" height="146" rx="10" fill="#ffffff" stroke="#ded7c9"/>
  <text x="318" y="128" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#384b5e">EDGE — AWS</text>
  <g font-size="13.5" fill="#17150f">
    <text x="318" y="154">React app (Vite)</text>
    <text x="318" y="182">Lambda Function URL</text>
  </g>
  <text x="318" y="199" font-size="11.5" fill="#575145">one function serves the SPA and the API</text>
  <text x="318" y="216" font-size="11.5" fill="#575145">from one origin — 29 of 45 API paths reachable</text>
  <text x="318" y="238" font-size="11.5" fill="#384b5e">The browser never holds an AWS credential</text>

  <!-- ─────────────────────────────────────────────────────── agent -->
  <rect x="616" y="104" width="624" height="146" rx="10" fill="#ffffff" stroke="#b2cbb7"/>
  <text x="634" y="128" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#3d6b4c">AGENT — decides WHAT TO DO</text>

  <rect x="634" y="140" width="184" height="92" rx="8" fill="#e4ede4" stroke="#b2cbb7"/>
  <text x="648" y="162" font-size="13" font-weight="600" fill="#17150f">AgentCore Runtime</text>
  <text x="648" y="181" font-size="11.5" fill="#575145">hosted entrypoint</text>
  <text x="648" y="197" font-size="11.5" fill="#575145">AWS_IAM inbound auth</text>
  <text x="648" y="213" font-size="11.5" fill="#575145">one session per invocation</text>

  <rect x="830" y="140" width="212" height="92" rx="8" fill="#e4ede4" stroke="#b2cbb7"/>
  <text x="844" y="162" font-size="13" font-weight="600" fill="#17150f">Strands agent loop</text>
  <text x="844" y="181" font-size="11.5" fill="#575145">PoolCoordinator · one bounded run</text>
  <text x="844" y="197" font-size="11.5" fill="#575145">BoundedRun hook provider:</text>
  <text x="844" y="213" font-size="11.5" fill="#575145">8 iterations · 25 calls · 45 s cooperative</text>

  <rect x="1054" y="140" width="170" height="92" rx="8" fill="#e4ede4" stroke="#b2cbb7"/>
  <text x="1068" y="162" font-size="13" font-weight="600" fill="#17150f">Amazon Bedrock</text>
  <text x="1068" y="181" font-size="11.5" fill="#575145">model inference</text>
  <text x="1068" y="197" font-size="11.5" fill="#575145">nova-lite, via Strands</text>
  <text x="1068" y="213" font-size="11.5" fill="#575145">offline planner when local</text>

  <!-- ─────────────────────────────────────────────────── connectors -->
  <line x1="276" y1="177" x2="298" y2="177" stroke="#8a8272" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="592" y1="177" x2="614" y2="177" stroke="#8a8272" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="818" y1="186" x2="828" y2="186" stroke="#8a8272" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="1042" y1="186" x2="1052" y2="186" stroke="#8a8272" stroke-width="1.4" marker-end="url(#a)"/>

  <path d="M928 232 V276" stroke="#3d6b4c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="940" y="262" font-size="11.5" fill="#3d6b4c">the only way out: 12 typed tools</text>

  <!-- ────────────────────────────────────────────── deterministic -->
  <rect x="40" y="284" width="1200" height="186" rx="10" fill="#ffffff" stroke="#b6c4d2"/>
  <text x="58" y="308" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#384b5e">DETERMINISTIC — determines WHAT IS TRUE</text>

  <rect x="58" y="320" width="256" height="132" rx="8" fill="#e5ebf1" stroke="#b6c4d2"/>
  <text x="72" y="342" font-size="13" font-weight="600" fill="#17150f">agent/tools.py — 12 tools</text>
  <text x="72" y="361" font-size="11.5" fill="#575145">typed · narrow · no shell, no SQL</text>
  <text x="72" y="378" font-size="11.5" fill="#575145">4 read · 1 record · 6 act · 1 end</text>
  <text x="72" y="395" font-size="11.5" fill="#575145">each consequential one idempotent</text>
  <text x="72" y="412" font-size="11.5" fill="#575145">by an explicit key</text>
  <text x="72" y="437" font-size="11.5" fill="#384b5e">results projected before the model sees</text>
  <text x="72" y="450" font-size="11.5" fill="#384b5e">them — 35.8k → 19.2k input tokens</text>

  <rect x="330" y="320" width="300" height="132" rx="8" fill="#e5ebf1" stroke="#b6c4d2"/>
  <text x="344" y="342" font-size="13" font-weight="600" fill="#17150f">services/ — orchestration</text>
  <text x="344" y="363" font-size="11.5" fill="#575145">coordination · discover, form, price, lock</text>
  <text x="344" y="381" font-size="11.5" fill="#575145">hosting · recruit, rank, offer</text>
  <text x="344" y="399" font-size="11.5" fill="#575145">payments · authorise, capture, webhooks</text>
  <text x="344" y="417" font-size="11.5" fill="#575145">fulfillment · purchase, pickup, issues</text>
  <text x="344" y="435" font-size="11.5" fill="#575145">communication · updates, exceptions</text>

  <rect x="646" y="320" width="332" height="132" rx="8" fill="#e5ebf1" stroke="#b6c4d2"/>
  <text x="660" y="342" font-size="13" font-weight="600" fill="#17150f">domain/ — pure, no I/O, no adapter imports</text>
  <text x="660" y="363" font-size="11.5" fill="#575145">economics · landed price, fees, case fitting</text>
  <text x="660" y="381" font-size="11.5" fill="#575145">viability · the 13-check gate before a lock</text>
  <text x="660" y="399" font-size="11.5" fill="#575145">policy · Smart Join’s three verdicts</text>
  <text x="660" y="417" font-size="11.5" fill="#575145">matching · timing · pickup · money · state</text>
  <text x="660" y="437" font-size="11.5" font-weight="600" fill="#384b5e">A model client cannot reach any of this</text>

  <rect x="994" y="320" width="228" height="132" rx="8" fill="#ffffff" stroke="#ded7c9"/>
  <text x="1008" y="342" font-size="13" font-weight="600" fill="#17150f">adapters/</text>
  <text x="1008" y="363" font-size="11.5" fill="#575145">payments · simulated</text>
  <text x="1008" y="381" font-size="11.5" fill="#575145">(Stripe TEST only — a live key</text>
  <text x="1008" y="396" font-size="11.5" fill="#575145">is refused unconditionally)</text>
  <text x="1008" y="416" font-size="11.5" fill="#575145">purchase · simulated, flagged</text>
  <text x="1008" y="437" font-size="11.5" fill="#575145">routing · deterministic function</text>

  <path d="M540 470 V510" stroke="#8a8272" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M58 512 H22 V270 H446 V252" stroke="#384b5e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="40" y="279" font-size="11.5" fill="#384b5e">authoritative run + pool readback returns to the browser</text>

  <!-- ─────────────────────────────────────────────────────── state -->
  <rect x="40" y="512" width="596" height="150" rx="10" fill="#ffffff" stroke="#ded7c9"/>
  <text x="58" y="536" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#384b5e">STATE AND EVIDENCE — AWS</text>
  <g font-size="13" font-weight="600" fill="#17150f">
    <text x="58" y="562">DynamoDB — one table, on-demand, TTL</text>
    <text x="58" y="614">CloudWatch — structured run records</text>
  </g>
  <text x="58" y="580" font-size="11.5" fill="#575145">pk = "&lt;workspace&gt;#&lt;TYPE&gt;", sk = "&lt;entity id&gt;". Each demo visitor is</text>
  <text x="58" y="596" font-size="11.5" fill="#575145">isolated in their own partition and expires after 24 hours.</text>
  <text x="58" y="632" font-size="11.5" fill="#575145">Run + resulting pool read back from the same workspace; created_by_run proves causality.</text>
  <text x="58" y="648" font-size="11.5" fill="#575145">Tool sequence, termination, duration, tokens; no reasoning text, arguments hashed.</text>

  <!-- ───────────────────────────────────────────────── not enabled -->
  <rect x="656" y="512" width="584" height="150" rx="10" fill="#f2efe9" stroke="#c6bdab" stroke-dasharray="5 4"/>
  <text x="674" y="536" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#6f6759">IMPLEMENTED BUT NOT DEPLOYED / ABSENT FROM JUDGE PATH</text>
  <g font-size="13" font-weight="600" fill="#3f3a31">
    <text x="674" y="562">EventBridge — background scan</text>
    <text x="674" y="606">Amazon Location — geo-routes</text>
    <text x="674" y="650">API Gateway · S3 · CloudFront — the pilot-shaped stack</text>
  </g>
  <text x="674" y="580" font-size="11.5" fill="#6f6759">Pilot-stack code only. Deployed judge account: zero EventBridge rules.</text>
  <text x="674" y="624" font-size="11.5" fill="#6f6759">Adapter exists and is tested; never called against the live service.</text>

  <!-- ────────────────────────────────────────────────────── legend -->
  <g font-size="11.5">
    <path d="M46 700 52 706 46 712 40 706z" fill="#3d6b4c"/>
    <text x="60" y="710" fill="#575145">green — the agent chose to do this</text>
    <rect x="264" y="700" width="11" height="11" rx="2" fill="#384b5e"/>
    <text x="284" y="710" fill="#575145">blue — deterministic code computed it, and it could not have been otherwise</text>
    <circle cx="782" cy="706" r="5.5" fill="#a0512a"/>
    <text x="796" y="710" fill="#575145">clay — a person was asked</text>
    <rect x="990" y="700" width="11" height="11" rx="2" fill="#f2efe9" stroke="#c6bdab" stroke-dasharray="3 2"/>
    <text x="1010" y="710" fill="#575145">dashed — implemented, not deployed</text>
  </g>
  <text x="40" y="740" font-size="11.5" fill="#6f6759">Synthetic community, synthetic suppliers, simulated payments and a simulated supplier purchase. Bedrock, AgentCore Runtime, DynamoDB and the Lambda Function URL are verified on a real account.</text>
</svg>
